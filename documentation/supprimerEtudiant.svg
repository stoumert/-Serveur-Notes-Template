nt-size="13" lengthAdjust="spacing" textLength="162.0684" x="1545" y="1303.356">respecter les contraintes</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="129.5684" x="1545" y="1318.4888">de cl&#233;s &#233;trang&#232;res :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1545" y="1333.6216">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="115.0894" x="1545" y="1348.7544">1. DELETE grades</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="132.4058" x="1557.397" y="1363.8872">(notes de l'&#233;tudiant)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1545" y="1379.02">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="141.2607" x="1545" y="1394.1528">2. DELETE enrollment</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="152.4199" x="1557.397" y="1409.2856">(inscriptions aux cours)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1545" y="1424.4185">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="126.9722" x="1545" y="1439.5513">3. DELETE students</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="137.4395" x="1557.397" y="1454.6841">(l'&#233;tudiant lui-m&#234;me)</text><path d="M1376,1472.75 L1376,1618.75 L1638,1618.75 L1638,1482.75 L1628,1472.75 L1376,1472.75" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1628,1472.75 L1628,1482.75 L1638,1482.75 L1628,1472.75" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156.019" x="1382" y="1489.8169">Nettoyage du cache :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1382" y="1504.9497">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="141.6035" x="1382" y="1520.0825">remove(42) supprime</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="241.8647" x="1382" y="1535.2153">l'&#233;tudiant du Map&lt;Integer, Student&gt;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1382" y="1550.3481">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="177.3599" x="1382" y="1565.481">Le cache reste synchronis&#233;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="161.605" x="1382" y="1580.6138">avec la base de donn&#233;es</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1382" y="1595.7466">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="194.9302" x="1382" y="1610.8794">&#8594; Pas de donn&#233;es "fant&#244;mes"</text><path d="M10,1628.9453 L10,1819.9453 L224,1819.9453 L224,1638.9453 L214,1628.9453 L10,1628.9453" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M214,1628.9453 L214,1638.9453 L224,1638.9453 L214,1628.9453" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="79.1426" x="16" y="1646.0122">Attention :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="16" y="1661.145">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="153.8545" x="16" y="1676.2778">Suppression d&#233;finitive !</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="16" y="1691.4106">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="193.229" x="16" y="1706.5435">Toutes les donn&#233;es associ&#233;es</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="93.5645" x="16" y="1721.6763">sont perdues :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="46.3696" x="16" y="1736.8091">- Notes</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="83.7002" x="16" y="1751.9419">- Inscriptions</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="75.48" x="16" y="1767.0747">- Historique</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="16" y="1782.2075">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="151.8232" x="16" y="1797.3403">Souvent mieux de faire</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="173.272" x="16" y="1812.4731">un "soft delete" (flag actif)</text><path d="M1734,1830.5391 L1734,2021.5391 L1955,2021.5391 L1955,1840.5391 L1945,1830.5391 L1734,1830.5391" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1945,1830.5391 L1945,1840.5391 L1955,1840.5391 L1945,1830.5391" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="200.1226" x="1740" y="1847.606">Alternative recommand&#233;e :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1740" y="1862.7388">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="123.208" x="1740" y="1877.8716">Au lieu de DELETE,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="157.5552" x="1740" y="1893.0044">utiliser un flag "active" :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1740" y="1908.1372">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="113.0137" x="1740" y="1923.27">UPDATE students</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="118.1362" x="1740" y="1938.4028">SET active = false</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="99.7852" x="1740" y="1953.5356">WHERE id = 42</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1740" y="1968.6685">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="150.9727" x="1740" y="1983.8013">&#8594; Permet de conserver</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="72.3062" x="1752.397" y="1998.9341">l'historique</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="146.5864" x="1740" y="2014.0669">&#8594; Permet de restaurer</text><?plantuml-src dLRDRXit4BxpAIPxiIn4iUFwP3G175k5tSQHOIbf2nWewDsHJ62Nt99SnNw10hssrpv0r7FVODyaJzBXp_x8acsqXW6loM_c6yvyC-GBUui5Gfbp8PaLDaSu7RyVpyPm1DEgB3KQ8vI4RAUIKFzkgqnmQHdZgLKQFbgH2yCjLXguWSgWPYNNLgIY91WaKp90QJy9_9mun98-rX77PNcYfDKgpr5x3ASLg_EjZXv0ZSqUXKvHBqMA0HU-j-Aki5H6q6dkFLJJlrjn5rpoHUGjmZVBkEKtt20atv--Eud0q-E91sLSzG2dyIjitJ3caWMZjpubbEpBoNG6UoQus3iysCimHuikqM996GwfOnxTMPteUaLk6kRPv5ho9QOWiZU71nqwffGC5cWtKZdOxLYQv3SMeuvhmuvbk67NKiRIa5quoC2qCVRecWAo1kuiGx6UiumbPJotyAbUQJ4NARTEgtWdZ4L9BWQgT2iIATnT1lJJE2SUL-cGaNVtvzdWy20WMWQl1BVYW