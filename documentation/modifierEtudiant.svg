xtLength="92.8726" x="1576" y="1331.7466">1. remove(42)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="192.9561" x="1588.397" y="1346.8794">&#8594; Supprime ancienne version</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1576" y="1362.0122">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="151.1187" x="1576" y="1377.145">2. put(42, newStudent)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="168.0415" x="1588.397" y="1392.2778">&#8594; Ajoute nouvelle version</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1576" y="1407.4106">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="157.3647" x="1576" y="1422.5435">Le cache reste coh&#233;rent</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="161.605" x="1576" y="1437.6763">avec la base de donn&#233;es</text><path d="M10,1455.7422 L10,1570.7422 L231,1570.7422 L231,1465.7422 L221,1455.7422 L10,1455.7422" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M221,1455.7422 L221,1465.7422 L231,1465.7422 L221,1455.7422" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="97.4746" x="16" y="1472.8091">Cas d'usage :</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="16" y="1487.9419">&#160;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="200.7954" x="16" y="1503.0747">- Changement de nom/pr&#233;nom</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="195.6411" x="16" y="15